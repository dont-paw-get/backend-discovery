openapi: 3.1.0
info:
  title: DPYB Discovery API
  description: >
    DPYB(Don't Paw Get Your Book)의 AI · 탐색(Discovery) 전담 마이크로서비스 wire 계약.
    이 파일이 API 계약의 단일 소유 산출물이다. `.harness/*`는 이 내용을 복제하지 않고 참조만 한다.
  version: 0.1.0

servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: chat
    description: Custom RAG 기반 자연어 도서 추천 챗봇 (사서 페르소나)
  - name: curations
    description: 시간대/테마 기반 도서 큐레이션
  - name: internal
    description: Basic API 서버로부터의 서비스 간 동기화 전용 엔드포인트

components:
  securitySchemes:
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Basic API 서버 등 내부 호출자만 사용하는 공유 시크릿 토큰

  schemas:
    Error:
      type: object
      description: 표준 에러 응답 (스키마 상세는 Task 9에서 확정)
      properties:
        detail:
          type: string
      required:
        - detail

    # 아래 요청/응답 스키마는 뼈대(placeholder)이며 Task 9에서 상세 확정한다.
    ChatRequest:
      type: object
      description: TODO(Task 9) — 상세 스키마 확정
      properties:
        session_id:
          type: string
          nullable: true
        message:
          type: string
      required:
        - message

    ChatResponse:
      type: object
      description: TODO(Task 9) — 상세 스키마 확정
      properties:
        session_id:
          type: string
        answer:
          type: string
        source_books:
          type: array
          items:
            type: object

    CurationResponse:
      type: object
      description: TODO(Task 9) — 상세 스키마 확정
      properties:
        theme:
          type: string
        books:
          type: array
          items:
            type: object

    SyncBookRequest:
      type: object
      description: TODO(Task 9) — 상세 스키마 확정. Basic API가 전달하는 도서 payload
      properties:
        book_id:
          type: string
        title:
          type: string
      required:
        - book_id
        - title

    SyncBookResponse:
      type: object
      description: TODO(Task 9) — 상세 스키마 확정
      properties:
        book_id:
          type: string
        synced_at:
          type: string
          format: date-time

paths:
  /chat:
    post:
      tags: [chat]
      summary: 자연어 질의 기반 도서 추천 (사서 페르소나 RAG)
      description: TODO(Task 9) — 상세 계약 확정 (Task 12에서 구현)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: 추천 답변 및 근거 도서 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: 요청 스키마 검증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: 하위 의존성(LLM/DB/Redis) 장애
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /curations/time-based:
    get:
      tags: [curations]
      summary: 시간대/테마 기반 도서 큐레이션 조회
      description: TODO(Task 9) — 상세 계약 확정 (Task 11에서 구현)
      responses:
        "200":
          description: 현재 테마와 해당 테마의 도서 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurationResponse"
        "400":
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: 요청 스키마 검증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: 하위 의존성(DB) 장애
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /internal/sync-book:
    post:
      tags: [internal]
      summary: Basic API로부터 도서 데이터 동기화 (임베딩 추출 후 읽기 모델 upsert)
      description: TODO(Task 9) — 상세 계약 확정 (Task 10에서 구현)
      security:
        - InternalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncBookRequest"
      responses:
        "200":
          description: 동기화 성공 (멱등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncBookResponse"
        "400":
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: X-Internal-Token 누락 또는 불일치
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 참조 리소스 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: 요청 스키마 검증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: 하위 의존성(임베딩/DB) 장애
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
