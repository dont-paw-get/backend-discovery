openapi: 3.1.0
info:
  title: DPYB Discovery API
  description: >
    DPYB(Don't Paw Get Your Book)의 backend-discovery 서비스 wire 계약.
    이 파일이 API 계약의 단일 소유 산출물이다. `.harness/*`는 이 내용을 복제하지 않고 참조만 한다.

    2026-08-21 방향 전환으로 벡터DB(pgvector) 기반 RAG 챗봇·큐레이션 계약(`/chat`,
    `/curations/time-based`, `/internal/sync-book`)은 폐기되어 `archive/vector-search-poc/`로
    이동했다 (`.harness/DECISIONS.md` 참고). 현재 이 서비스에 남은 공개 계약은 없으며,
    `/health`만 기동 확인용으로 존재한다(코드에는 있으나 이 문서는 헬스체크 엔드포인트를
    별도로 문서화하지 않는다).

    사서 에이전트(대화·큐레이션 RAG)는 별도 레포로 이관되어 새로 설계된다. 그 레포의
    API 계약은 이 파일이 아니라 해당 레포의 `docs/api/`가 소유한다.
  version: 0.2.0

servers:
  - url: http://localhost:8000
    description: Local development

paths: {}
