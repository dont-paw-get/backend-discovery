AWSTemplateFormatVersion: "2010-09-09"
Description: "DPYB Discovery - CloudWatch Custom LLM Dashboard Stack (FinOps, Latency, Token & Cache)"

Parameters:
  DashboardName:
    Type: String
    Default: "DPYB-Discovery-LLM-Dashboard"
    Description: "Name of the CloudWatch Dashboard"

  ModelDimension:
    Type: String
    Default: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
    Description: "Bedrock Model dimension to monitor in dashboard"

Resources:
  DiscoveryLLMDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref DashboardName
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "DPYB/Discovery/LLM", "RequestLatencyMs", "Model", "${ModelDimension}", { "stat": "p90", "label": "E2E Latency (p90)" } ],
                  [ "...", { "stat": "Average", "label": "E2E Latency (Avg)" } ],
                  [ ".", "TimeToFirstByteMs", ".", ".", { "stat": "p90", "label": "TTFT (p90)", "color": "#2ca02c" } ],
                  [ "...", { "stat": "Average", "label": "TTFT (Avg)", "color": "#98df8a" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "⚡ [성능] 체감 지연시간 & TTFT 추이 (ms)",
                "period": 900,
                "yAxis": {
                  "left": {
                    "label": "Milliseconds",
                    "showUnits": false
                  }
                }
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "DPYB/Discovery/LLM", "BedrockCostUSD", "Model", "${ModelDimension}", { "stat": "Sum", "label": "Haiku 4.5 Cost (USD)", "color": "#d62728" } ]
                ],
                "view": "bar",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "💰 [FinOps] Bedrock 시간당 비용 (USD)",
                "period": 3600,
                "yAxis": {
                  "left": {
                    "label": "USD ($)",
                    "showUnits": false
                  }
                }
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "DPYB/Discovery/LLM", "InputTokens", "Model", "${ModelDimension}", { "stat": "Sum", "label": "Input Tokens", "id": "m_input" } ],
                  [ ".", "OutputTokens", ".", ".", { "stat": "Sum", "label": "Output Tokens", "id": "m_output" } ],
                  [ ".", "CacheReadTokens", ".", ".", { "stat": "Sum", "label": "Cache Read Tokens (90% 할인)", "id": "m_cache_read", "color": "#1f77b4" } ],
                  [ { "expression": "m_cache_read / (m_input + m_cache_read) * 100", "label": "프롬프트 캐시 히트율 (%)", "id": "e_cache_ratio", "yAxis": "right" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "📊 [토큰 & 캐시] 토큰 사용량 및 프롬프트 캐시 절감율",
                "period": 900,
                "yAxis": {
                  "left": {
                    "label": "Tokens",
                    "showUnits": false
                  },
                  "right": {
                    "label": "Ratio (%)",
                    "showUnits": false,
                    "max": 100,
                    "min": 0
                  }
                }
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 6,
              "width": 8,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "DPYB/Discovery/LLM", "SearchCacheHit", { "stat": "Sum", "label": "Cache Hit", "id": "m_hit", "color": "#2ca02c" } ],
                  [ ".", "SearchCacheMiss", { "stat": "Sum", "label": "Cache Miss", "id": "m_miss", "color": "#ff7f0e" } ]
                ],
                "view": "bar",
                "stacked": true,
                "region": "${AWS::Region}",
                "title": "🔍 [검색 캐시] Tavily 도서 검색 Redis 캐시 Hit/Miss",
                "period": 900,
                "yAxis": {
                  "left": {
                    "label": "Counts",
                    "showUnits": false
                  }
                }
              }
            },
            {
              "type": "metric",
              "x": 20,
              "y": 6,
              "width": 4,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "DPYB/Discovery/LLM", "SearchCacheHit", { "stat": "Sum", "id": "m_hit", "visible": false } ],
                  [ ".", "SearchCacheMiss", { "stat": "Sum", "id": "m_miss", "visible": false } ],
                  [ { "expression": "m_hit / (m_hit + m_miss) * 100", "label": "도서 검색 캐시 히트율 (%)", "id": "e_search_ratio" } ]
                ],
                "view": "singleValue",
                "region": "${AWS::Region}",
                "title": "검색 캐시 히트율",
                "period": 900,
                "sparkline": true
              }
            }
          ]
        }

Outputs:
  DashboardName:
    Description: "Deployed CloudWatch Dashboard Name"
    Value: !Ref DiscoveryLLMDashboard
