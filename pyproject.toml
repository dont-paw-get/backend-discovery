[project]
name = "discovery"
version = "0.1.0"
description = "DPYB(Don't Paw Get Your Book) AI · Discovery 마이크로서비스"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "sqlalchemy[asyncio]>=2.0.35,<2.1.0",
    "asyncpg>=0.30.0,<0.31.0",
    "pgvector>=0.3.6,<0.4.0",
    "alembic>=1.13.3,<1.14.0",
    "redis>=5.1.1,<5.2.0",
    "pydantic>=2.9.2,<2.10.0",
    "pydantic-settings>=2.5.2,<2.6.0",
    "boto3>=1.43.74,<1.44.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0,<0.8.0",
    "mypy>=1.11.2,<1.12.0",
    "pytest>=8.3.3,<8.4.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "pytest-mock>=3.14.0,<3.15.0",
    "testcontainers[postgres]>=4.8.1,<4.9.0",
    "httpx>=0.27.2,<0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discovery"]

[tool.pytest.ini_options]
markers = [
    "integration: PostgreSQL/Redis 등 실제 인프라(Testcontainers)를 사용하는 통합 테스트",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true
