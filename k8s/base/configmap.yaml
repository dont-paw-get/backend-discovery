apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-discovery-config
  labels:
    app.kubernetes.io/name: backend-discovery
# 민감하지 않은 설정값만 여기에 둡니다.
# Redis 접속정보, API 키 등 비밀값은 Secret 에 둡니다.
data:
  LLM_PROVIDER: "bedrock"
  # Claude Haiku 4.5 글로벌 프로파일 사용 시 us-east-1 필수
  AWS_REGION: "us-east-1"
  CHAT_HISTORY_MAX_TURNS: "20"
  CHAT_SESSION_TTL_SECONDS: "3600"
  LIBRARIAN_MODEL_ID: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
  ORCHESTRATOR_MODEL_ID: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
  # [서울 리전 초저지연 fallback 옵션 (TTFT ~600ms)]
  # AWS_REGION: "ap-northeast-2"
  # LIBRARIAN_MODEL_ID: "anthropic.claude-3-5-sonnet-20240620-v1:0"
  # ORCHESTRATOR_MODEL_ID: "anthropic.claude-3-5-sonnet-20240620-v1:0"
  GENRE_CLASSIFIER_MODEL_ID: "global.anthropic.claude-haiku-4-5-20251001-v1:0"
  TAVILY_CACHE_TTL_SECONDS: "86400"
  TAVILY_MONTHLY_CREDIT_LIMIT: "900"
  # 사서 에이전트(backend-librarian) 서비스 URL. 클러스터 내부 서비스면
  # http://<service-name>.<namespace>.svc.cluster.local:<port> 형태로 채웁니다.
  # LIBRARIAN_AGENT_URL: ""
  LIBRARIAN_DEFAULT_ID: "cat"
  LIBRARIAN_HTTP_TIMEOUT_SECONDS: "20"
  INITIAL_META_TIMEOUT_SECONDS: "1.5"
  # 서재 도서 CRUD API (backend-book) 서비스 URL. 필수값 — 미설정 시 앱이 기동되지 않습니다.
  LIBRARY_API_URL: "http://k8s-dpybbook-backendb-d17a725d36-1113312703.ap-northeast-2.elb.amazonaws.com"
  LIBRARY_HTTP_TIMEOUT_SECONDS: "10"
  # CORS 허용 오리진 (콤마로 구분). 프론트 배포 도메인 + 로컬 개발 주소.
  CORS_ALLOWED_ORIGINS: "https://d1wab52ln5by5k.cloudfront.net,http://localhost:3000"
  # OpenTelemetry 분산 트레이싱: OTEL_EXPORTER_OTLP_ENDPOINT가 설정된 환경에서만
  # 활성화된다(미설정 시 앱은 정상 기동, export 없음). 환경별 값은 overlay에서 주입한다
  # (dev: overlays/dev/configmap-patch.yaml). 관측 설정은 비밀이 아니므로 ConfigMap에 둔다.
