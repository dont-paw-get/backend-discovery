# 개발 환경에서 base ConfigMap 위에 덮어쓸 값
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-discovery-config
data:
  LLM_PROVIDER: "bedrock"
  LIBRARIAN_AGENT_URL: "http://backend-librarian.dpyb-librarian-dev.svc.cluster.local"
  # CLIAR-276: 기존 Prometheus/Grafana/Loki 관측 스택과 완전히 분리된 AWS CloudWatch
  # 커스텀 메트릭(Bedrock 비용 USD, 토큰 사용량, 검색 캐시 히트율) 발행 스위치.
  ENABLE_CLOUDWATCH_METRICS: "true"
  # CLIAR-298: Amazon Bedrock Guardrails 활성화 (CloudFormation dpyb-discovery-guardrail 스택)
  # 2026-09-06: 기존 ID(35g4g149bbe7)는 us-east-1에 생성되어 있었으나, discovery pod의
  # 실제 Bedrock 호출 리전(IRSA가 주입하는 AWS_REGION=ap-northeast-2, 서울)과 불일치해
  # ConverseStream이 "guardrail identifier ... does not exist" ValidationException으로
  # 매번 실패했다(BEDROCK_FALLBACK). 서울 리전에 동일 스택을 재배포해 새 ID로 교체.
  ENABLE_BEDROCK_GUARDRAIL: "true"
  BEDROCK_GUARDRAIL_ID: "m81pa4dhk7pc"
  BEDROCK_GUARDRAIL_VERSION: "1"
  # --- OpenTelemetry 분산 트레이싱 (dev) ---
  # OTel Collector(OTLP HTTP)로 전송 → Grafana Tempo. stdout JSON 로그는 Alloy가
  # 수집해 Loki로 보내며, 로그의 trace_id로 Tempo ↔ Loki correlation이 된다.
  # 이 값들은 비밀이 아니므로 ConfigMap에 둔다 (Secret으로 옮기지 않는다).
  OTEL_SERVICE_NAME: "backend-discovery"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "1.0"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev,service.namespace=dpyb"
  # infra Collector는 traces 파이프라인만 받는다. 메트릭/로그 OTLP export는 끈다
  # (메트릭은 /metrics + ServiceMonitor로, 로그는 stdout JSON + Alloy로 수집).
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
