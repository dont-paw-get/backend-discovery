# ⚠️ 이 파일은 "예시" 입니다. 실제 비밀값을 여기에 적어 Git 에 커밋하지 마세요.
# ArgoCD Application 에서 *.example.yaml 은 제외하도록 설정되어 있습니다.
#
# 실제 Secret 생성 방법 (택 1):
#
# 1) kubectl 로 직접 생성 (가장 간단, 클러스터에만 존재하고 Git 에는 안 올라감)
#    kubectl create secret generic backend-discovery-secret \
#      --namespace dpyb-discovery-dev \
#      --from-literal=REDIS_URL='redis://<host>:6379/0' \
#      --from-literal=INTERNAL_API_TOKEN='xxxxxxxx' \
#      --from-literal=TAVILY_API_KEY='xxxxxxxx'
#
# 2) SealedSecrets / External Secrets Operator 를 써서 암호화된 형태로 Git 관리 (권장, 운영환경)
#    - SealedSecrets: kubeseal 로 암호화한 SealedSecret 을 커밋
#    - External Secrets: AWS Secrets Manager / SSM Parameter Store 와 연동
#
# 아래는 참고용 구조입니다.
apiVersion: v1
kind: Secret
metadata:
  name: backend-discovery-secret
  namespace: dpyb-discovery-dev
  labels:
    app.kubernetes.io/name: backend-discovery
type: Opaque
stringData:
  # 대화 세션(Redis) 접속 정보. 클러스터 내부 Redis 또는 ElastiCache 엔드포인트를 채웁니다.
  REDIS_URL: "redis://<host>:6379/0"
  # /internal/* 라우터 전용 공유 시크릿 (X-Internal-Token 헤더 검증에 사용)
  INTERNAL_API_TOKEN: "<optional>"
  # Tavily 웹 검색 API 키
  TAVILY_API_KEY: "<optional>"
