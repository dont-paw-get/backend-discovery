openapi: 3.1.0
info:
  title: DPYB Discovery API
  description: >
    DPYB(Don't Paw Get Your Book)의 AI · 탐색(Discovery) 전담 마이크로서비스 wire 계약.
    이 파일이 API 계약의 단일 소유 산출물이다. `.harness/*`는 이 내용을 복제하지 않고 참조만 한다.
  version: 0.1.0

servers:
  - url: http://localhost:8000
    description: Local development

tags:
  - name: chat
    description: Custom RAG 기반 자연어 도서 추천 챗봇 (사서 페르소나)
  - name: curations
    description: 시간대/테마 기반 도서 큐레이션
  - name: internal
    description: Basic API 서버로부터의 서비스 간 동기화 전용 엔드포인트

components:
  securitySchemes:
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Basic API 서버 등 내부 호출자만 사용하는 공유 시크릿 토큰

  schemas:
    Error:
      type: object
      description: 표준 에러 응답. FastAPI `HTTPException`이 생성하는 형태와 1:1이다.
      properties:
        detail:
          type: string
          example: X-Internal-Token 헤더가 없거나 값이 일치하지 않습니다.
      required:
        - detail

    BookSummary:
      type: object
      description: >
        도서 목록용 경량 DTO. `src/discovery/api/schemas/book.py`의 `BookSummary`와 1:1이다.
        embedding·description 등 무거운/상세 필드는 포함하지 않는다.
      properties:
        book_id:
          type: string
          description: Basic API가 부여한 외부 식별자
          example: bk-00042
        title:
          type: string
          example: 페인트공
        author:
          type: string
          example: 미상
        category:
          type: string
          description: 원본 그대로 저장된 카테고리 텍스트 (파싱 없음)
          example: 소설/한국문학
        synced_at:
          type: string
          format: date-time
      required:
        - book_id
        - title
        - author
        - category
        - synced_at

    ChatRequest:
      type: object
      description: 자연어 질의와 대화 세션 식별자.
      properties:
        session_id:
          type: string
          nullable: true
          description: >
            대화 세션 식별자. 생략하거나 null이면 서버가 새 세션 ID를 발급해 응답에
            포함한다. 같은 세션에서 이어지는 대화라면 이전 응답의 session_id를 그대로 보낸다.
          example: 3f9c1e2a-4b7d-4e21-9a3c-2f6b1d8e0c11
        message:
          type: string
          minLength: 1
          maxLength: 2000
          example: 비 오는 날 읽을 따뜻한 소설 추천해줘
      required:
        - message

    ChatResponse:
      type: object
      description: 사서 페르소나 답변과 근거 도서 목록.
      properties:
        session_id:
          type: string
          description: 이번 대화에 사용된 세션 식별자 (요청에 없었다면 새로 발급된 값).
          example: 3f9c1e2a-4b7d-4e21-9a3c-2f6b1d8e0c11
        answer:
          type: string
          example: 비 오는 날엔 따뜻한 위로가 되는 소설이 좋죠. "페인트공"을 추천드려요.
        source_books:
          type: array
          description: 답변의 근거로 사용된 도서 목록 (유사도 상위 순).
          items:
            $ref: "#/components/schemas/BookSummary"
      required:
        - session_id
        - answer
        - source_books

    CurationResponse:
      type: object
      description: 요청 시각을 매핑한 테마와 해당 테마의 도서 목록.
      properties:
        theme:
          type: string
          description: 요청 시각 구간에 매핑된 테마 (예- 새벽/아침/오후/저녁/심야).
          example: 심야
        books:
          type: array
          items:
            $ref: "#/components/schemas/BookSummary"
      required:
        - theme
        - books

    SyncBookRequest:
      type: object
      description: >
        Basic API가 전달하는 단건 도서 payload. 실시간 갱신·통합 테스트 용도이며 대량
        적재 수단이 아니다 (`docs/api/decisions/0001-internal-sync-contract.md` 참고).
      properties:
        book_id:
          type: string
          description: Basic API가 부여한 외부 식별자. upsert 멱등 키로 사용된다.
          example: bk-00042
        title:
          type: string
          example: 페인트공
        author:
          type: string
          example: 미상
        description:
          type: string
          description: 도서 소개. 임베딩 대상 텍스트(제목+저자+설명+category)에 포함된다.
          example: 시대의 아픔을 그려낸 소설.
        category:
          type: string
          description: 원본 그대로 저장된다 (파싱 없음).
          example: 소설/한국문학
      required:
        - book_id
        - title
        - author

    SyncBookResponse:
      type: object
      description: 동기화 결과. 재전송해도 같은 `book_id`면 동일한 응답 형태를 유지한다(멱등).
      properties:
        book_id:
          type: string
          example: bk-00042
        synced_at:
          type: string
          format: date-time
      required:
        - book_id
        - synced_at

paths:
  /chat:
    post:
      tags: [chat]
      summary: 자연어 질의 기반 도서 추천 (사서 페르소나 RAG)
      description: >
        질의를 임베딩해 pgvector 유사도 검색으로 후보 도서를 찾고, 사서 페르소나
        프롬프트로 추천 답변을 생성한다. `session_id`가 있으면 Redis에 저장된 이전
        대화 턴을 프롬프트에 포함해 문맥을 유지한다 (Task 12에서 구현).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: 추천 답변 및 근거 도서 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: 요청 스키마 검증 실패 (예- message 누락/길이 초과)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: 하위 의존성(LLM/DB/Redis) 장애
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /curations/time-based:
    get:
      tags: [curations]
      summary: 시간대/테마 기반 도서 큐레이션 조회
      description: >
        요청 시각을 새벽/아침/오후/저녁/심야 등 구간 룰에 매칭해 테마를 결정하고,
        해당 테마에 맞는 도서 목록을 반환한다 (Task 11에서 구현).
      responses:
        "200":
          description: 현재 테마와 해당 테마의 도서 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurationResponse"
        "400":
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: 요청 스키마 검증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: 하위 의존성(DB) 장애
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /internal/sync-book:
    post:
      tags: [internal]
      summary: Basic API로부터 도서 데이터 동기화 (임베딩 추출 후 읽기 모델 upsert)
      description: >
        Basic API가 개별 도서 생성/수정 시 실시간으로 호출하는 단건 동기화
        엔드포인트다. `book_id` 기준으로 멱등하게 upsert되며, 대량 초기 적재
        수단이 아니다 — 25만 건 규모의 대량 적재는 별도 CSV 배치로 처리한다
        (`docs/api/decisions/0001-internal-sync-contract.md` 참고, Task 10에서 구현).
      security:
        - InternalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncBookRequest"
      responses:
        "200":
          description: 동기화 성공 (멱등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncBookResponse"
        "400":
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: X-Internal-Token 누락 또는 불일치
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 참조 리소스 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: 요청 스키마 검증 실패 (예- book_id/title/author 누락)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: 하위 의존성(임베딩/DB) 장애
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
